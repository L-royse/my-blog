# ============================================================
# OpenCart 4 站点配置 —— shop 子域名
# 放到服务器 /etc/nginx/sites-available/shop.conf
# 占位符 __DOMAIN__ __WEBROOT__ 由部署脚本替换
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root __WEBROOT__;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 20m;

    access_log /var/log/nginx/shop.access.log;
    error_log  /var/log/nginx/shop.error.log;

    # ---------- 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml image/svg+xml;

    # ---------- 安全：拦截敏感文件 ----------
    location ~* (^|/)(\.git|\.env|composer\.(json|lock)|package\.json)$ {
        deny all;
    }

    # storage 目录不对外暴露
    location ^~ /storage/ {
        deny all;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    # ---------- OpenCart 路由 ----------
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # ---------- PHP ----------
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # ---------- 静态资源缓存 ----------
    location ~* \.(jpg|jpeg|png|gif|webp|ico|css|js|woff2?|ttf|svg)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { allow all; access_log off; log_not_found off; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /index.php?route=error/not_found;
}
