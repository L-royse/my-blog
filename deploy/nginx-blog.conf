# ============================================================
# Nginx 站点配置 —— 静态博客
# 放到服务器 /etc/nginx/sites-available/blog.conf
# 域名占位符 __DOMAIN__ 由 setup-server.sh 自动替换
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root /var/www/blog;
    index index.html;

    charset utf-8;

    # ---------- 日志 ----------
    access_log /var/log/nginx/blog.access.log;
    error_log  /var/log/nginx/blog.error.log;

    # ---------- 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ---------- 缓存策略 ----------
    # 带 hash 的静态资源长期缓存
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML 不缓存，保证更新立即生效
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    # 图片/字体等
    location ~* \.(png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---------- 路由 ----------
    # Astro 静态输出：/blog/xxx/ -> /blog/xxx/index.html
    location / {
        try_files $uri $uri/ $uri/index.html $uri.html =404;
    }

    # 自定义 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
